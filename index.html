<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paynet Developers — GPT Design</title><style>
:root{--blue:#2861d7;--ink:#192a44;--muted:#65768e;--border:#e1e8f2;--bg:#f8fafd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}a{color:var(--blue);text-decoration:none}.layout{display:flex;min-height:100vh}.side{width:270px;flex-shrink:0;position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}.brand{padding:23px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}.logo{background:var(--blue);color:white;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;font-weight:900;font-size:24px}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1px}.nav{padding:14px 12px;overflow:auto}.group{font-size:10px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#8b97a8;padding:17px 13px 8px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:0;border-radius:9px;background:transparent;color:#53647c;text-align:left;font-weight:550}.nav button:hover{background:#f4f7fd}.nav button.active{background:#edf3ff;color:#2057c8;font-weight:750}.ico{width:23px;text-align:center;font-size:19px;font-weight:400}.sidefoot{margin-top:auto;border-top:1px solid var(--border);padding:16px 22px;color:#8995a5;font-size:11px}.main{min-width:0;flex:1}.top{height:68px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 38px;background:#fff}.crumb{color:#8a97aa;font-size:12px}.crumb b{color:#41536e}.pill{border:1px solid #e8d8ac;background:#fff8e8;color:#916b24;padding:6px 11px;border-radius:30px;font-size:11px;font-weight:700}.content{max-width:1140px;margin:auto;padding:44px 42px 80px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}h1{font-size:36px;line-height:1.2;letter-spacing:-1.3px;margin:10px 0 16px}h2{font-size:23px;letter-spacing:-.6px;margin:0 0 13px}h3{font-size:15px;margin:0 0 7px}.lead{font-size:16px;color:#64758b;max-width:800px;margin:0 0 28px}.notice{background:#eef5ff;border:1px solid #d7e6ff;border-radius:12px;padding:16px 18px;color:#416296;margin-bottom:27px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{border:1px solid var(--border);border-radius:14px;background:#fff;padding:22px;text-align:left;min-height:165px;transition:.15s}.tile:hover{border-color:#9cb7f2;transform:translateY(-2px)}.tile .symbol{display:grid;place-items:center;background:#eef4ff;border-radius:11px;width:42px;height:42px;font-size:21px;margin-bottom:15px}.tile strong{display:block;font-size:15px;margin-bottom:6px}.tile p{color:#6a7a8f;font-size:12px;margin:0}.section{margin-top:38px}.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.step,.panel{border:1px solid var(--border);border-radius:13px;background:white;padding:21px}.step .num{background:#eaf1ff;color:var(--blue);border-radius:7px;display:inline-grid;place-items:center;width:26px;height:26px;font-weight:800;margin-bottom:11px}.step p,.panel p{color:#63758c;margin:0;font-size:13px}.panelhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}.panelhead .symbol{font-size:23px;background:#eef4ff;padding:10px;border-radius:11px}.panelhead h2{margin:0}.editor{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:white}.editorhead,.editorfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 17px;flex-wrap:wrap}.editorhead{border-bottom:1px solid var(--border)}.editorfoot{border-top:1px solid var(--border)}.method{background:#e7f7f0;color:#137c5d;font-size:11px;padding:5px 9px;border-radius:6px;font-weight:800}.code{display:block;width:100%;min-height:245px;resize:vertical;border:0;outline:none;background:#19283d;color:#e1edff;padding:20px;font:13px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.btn{background:var(--blue);color:white;border:1px solid var(--blue);border-radius:8px;padding:9px 16px;font-weight:700}.btn2{border:1px solid var(--border);background:white;border-radius:8px;padding:8px 12px;color:#50617b}.hint{color:#8490a2;font-size:12px}.response{margin:0 17px 17px;border:1px solid var(--border);background:#f6f9fd;border-radius:9px;display:none}.response.show{display:block}.response b{display:block;border-bottom:1px solid var(--border);padding:10px 14px;font-size:12px}.response pre{white-space:pre-wrap;overflow:auto;margin:0;padding:15px;font:12px/1.7 monospace}.green{margin-top:14px;background:#f0faf6;border:1px solid #d5eee1;border-radius:10px;padding:14px 16px;color:#3a705e}.foot{padding-top:50px;text-align:center;color:#9aa5b5;font-size:11px}.mobile{display:none}@media(max-width:960px){.side{width:220px}.content{padding:34px 26px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{position:fixed;z-index:4;transform:translateX(-100%);transition:.2s;width:270px}.side.open{transform:translateX(0)}.mobile{display:inline-block;border:1px solid var(--border);background:white;border-radius:8px;padding:7px 11px;margin-right:10px}.top{padding:0 16px}.content{padding:27px 18px}.grid,.steps{grid-template-columns:1fr}h1{font-size:29px}.lead{font-size:14px}.pill{font-size:10px}}
</style></head><body><div class="layout"><aside class="side" id="side"><div class="brand"><span class="logo">P</span><div><strong>Paynet Developers</strong><small>GPT DESIGN REFERENCE</small></div></div><nav class="nav" id="nav"></nav><div class="sidefoot">Независимый визуальный прототип<br>Не является официальным API-клиентом</div></aside><main class="main"><header class="top"><div><button class="mobile" id="menu">☰</button><span class="crumb">Документация / <b id="crumb">Обзор платформы</b></span></div><span class="pill">Design demo · не API</span></header><div class="content" id="content"></div></main></div>
<script>
const sections=[["Начало работы",[["overview","⌂","Обзор платформы"],["quick","🚀","Быстрый старт"]]],["Платёжные операции",[["create","▣","Создать платёж"],["status","◷","Проверить статус"],["refund","↶","Вернуть деньги"]]],["Карты и уведомления",[["save","▤","Сохранение карт"],["unlink","⌫","Удаление карты"],["callback","♧","Уведомления"]]],["Для разработчика",[["security","♢","Безопасность"],["testing","⚙","Тестирование"],["reference","☰","API Reference"]]]];
const docs={
create:{title:"Создать платёж",icon:"▣",label:"Приём платежей",lead:"Создайте заказ в Paynet и направьте покупателя на страницу оплаты.",explain:"Магазин регистрирует заказ в Paynet, после чего покупатель переходит на платёжную страницу. Не выдавайте товар только на основании возврата браузера.",steps:[["Создать заказ","Передайте данные покупки и покупателя."],["Открыть оплату","Направьте покупателя на платёжную страницу."],["Проверить результат","Подтвердите оплату серверным запросом."]]},
status:{title:"Проверить статус",icon:"◷",label:"Проверка платежа",lead:"Убедитесь, что деньги действительно поступили, прежде чем выполнять заказ.",explain:"Переход покупателя на страницу успешной оплаты не доказывает успешный платёж. Проверяйте статус на сервере через авторизованный запрос.",steps:[["Найти заказ","Используйте сохранённый идентификатор."],["Запросить статус","Обратитесь к API Paynet."],["Сверить результат","Проверьте статус и сумму."]]},
refund:{title:"Вернуть деньги",icon:"↶",label:"После оплаты",lead:"Верните покупателю полную или часть оплаченной суммы.",explain:"Подтверждённое правило Paynet: один заказ — один возврат, полный либо частичный. Второй возврат по тому же платежу не предусмотрен.",steps:[["Найти платёж","Определите успешную оплату."],["Выбрать сумму","Полный или частичный возврат."],["Проверить результат","Обработайте ответ API."]]},
save:{title:"Сохранение карт",icon:"▤",label:"Повторные покупки",lead:"Покупатель может повторно использовать сохранённую карту без нового ввода реквизитов.",explain:"CardLinkHash — внутренний токен Paynet, не сетевой токен Visa/Mastercard. Он связан с Customer.Code и SaleArea. Использование между SaleArea допускается только после группировки на стороне Paynet.",steps:[["Первая покупка","Идентифицируйте покупателя и получите необходимое согласие."],["Получить токен","После успешной оплаты проверьте и сохраните CardLinkHash."],["Повторная оплата","Используйте токен в разрешённой SaleArea с соответствующим Customer.Code."]]},
unlink:{title:"Удаление карты",icon:"⌫",label:"Управление картами",lead:"Позвольте покупателю удалить сохранённую карту.",explain:"Для удаления связи карты используется специальный API-метод. Проверяйте, что запрос относится к нужному покупателю.",steps:[["Найти карту","Определите нужный CardLinkHash."],["Отправить unlink","Используйте авторизованный API-запрос."],["Обновить список","Больше не показывайте удалённую карту."]]},
callback:{title:"Уведомления",icon:"♧",label:"Серверные события",lead:"Получайте уведомления Paynet и безопасно подтверждайте состояние оплаты.",explain:"Подпись callback не охватывает все поля. Для критичных решений перепроверяйте неподписанные PaidAmount и CardLinkHash через авторизованный GET. Обработчик должен выдерживать повторы уведомлений.",steps:[["Получить событие","Примите HTTPS callback."],["Проверить подпись","Проверьте точный порядок подписанных полей."],["Сверить оплату","Проверьте состояние заказа через API."]]},
security:{title:"Безопасность",icon:"♢",label:"Защита платежей",lead:"Не доверяйте данным из браузера и защищайте ключи интеграции.",explain:"Храните секреты на сервере, проверяйте уведомления и используйте авторизованную проверку платежа перед выдачей товара.",steps:[["Хранить секреты","Никогда не размещайте API-ключи в браузере."],["Проверять callback","Валидируйте подпись и данные."],["Обрабатывать повторы","Делайте обработку идемпотентной."]]},
testing:{title:"Тестирование",icon:"⚙",label:"Перед запуском",lead:"Проверьте успешную оплату, возвраты и обработку ошибок.",explain:"Эта страница — только демонстрация дизайна. Реальное тестирование проводится через опубликованный портал Paynet и доступную тестовую среду.",steps:[["Создать тестовый заказ","Проверьте основной сценарий."],["Проверить уведомления","Обработайте повторы и неверные подписи."],["Проверить ошибки","Имитируйте отказы и сетевые проблемы."]]},
reference:{title:"API Reference",icon:"☰",label:"Технические детали",lead:"Описание полей, схем и методов должно точно соответствовать действующему контракту API.",explain:"Этот сайт — визуальный референс для Claude. Он не заменяет действующую спецификацию и не предоставляет настоящих endpoint для выполнения запросов.",steps:[["Выбрать метод","Найдите нужную операцию."],["Изучить параметры","Проверьте типы и обязательные поля."],["Выполнить запрос","Используйте официальный API Playground."]]}
};
const steps=a=>'<div class="steps">'+a.map((x,i)=>'<div class="step"><span class="num">'+(i+1)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join("")+'</div>';
const card=id=>{let d=docs[id];return '<button class="tile" data-page="'+id+'"><span class="symbol">'+d.icon+'</span><strong>'+d.title+'</strong><p>'+d.lead+'</p></button>'};
const editor=()=>'<div class="editor"><div class="editorhead"><div><span class="method">DEMO</span> <b style="font-size:12px;margin-left:8px">Редактируемый JSON · локальная симуляция</b></div><button class="btn2" id="copy">Копировать</button></div><textarea class="code" id="code" spellcheck="false">{\n  "order": "ORDER-DEMO-001",\n  "amount": 100,\n  "currency": "MDL",\n  "customerCode": "customer-demo-01"\n}</textarea><div class="editorfoot"><span class="hint">Измените JSON и нажмите Test · без сетевого запроса</span><button class="btn" id="test">▶ Test (simulation)</button></div><div class="response" id="response"><b>Результат локальной проверки · не ответ Paynet</b><pre id="output"></pre></div></div><div class="green">✓ Один интерактивный блок: редактирование и тестирование рядом. Здесь Test проверяет только JSON. Реальный API Playground остаётся в действующем портале.</div>';
function overview(){return '<div class="eyebrow">PAYNET E-COMMERCE · GPT DESIGN</div><h1>Платежи, которые легко подключить</h1><p class="lead">Понятная документация для разработчиков любого уровня. Узнайте, как принимать оплату, сохранять карты и возвращать деньги — шаг за шагом.</p><div class="notice"><b>Независимый дизайн-референс.</b> Это не официальный API-клиент: кнопка Test не обращается к Paynet, а примеры не являются действующим API-контрактом.</div><h2>Что вы хотите сделать?</h2><div class="grid">'+["create","status","refund","save","unlink","callback"].map(card).join("")+'</div><div class="section"><h2>Как работает оплата</h2>'+steps([["Создать заказ","Магазин регистрирует заказ в Paynet."],["Покупатель платит","Оплата происходит на платёжной странице."],["Подтвердить результат","Магазин проверяет статус сервером."]])+'</div><div class="section panel"><h2>От понятного объяснения к коду</h2><p>Сначала объясняем смысл функции обычными словами, затем показываем техническую часть. Рабочий редактор Claude нужно сохранить, а не заменять этой демонстрацией.</p><p style="margin-top:15px"><button class="btn" data-page="create">Посмотреть пример →</button></p></div>'}
function detail(id){let d=docs[id];return '<div class="eyebrow">'+d.label+'</div><h1>'+d.title+'</h1><p class="lead">'+d.lead+'</p><div class="panel"><div class="panelhead"><span class="symbol">'+d.icon+'</span><h2>Что это и зачем нужно?</h2></div><p>'+d.explain+'</p></div><div class="section"><h2>Как это работает</h2>'+steps(d.steps)+'</div><div class="section"><h2>Пример интерактивного блока</h2><p style="color:#687991">Ниже показан принцип интерфейса, а не настоящий endpoint Paynet. Здесь можно редактировать JSON и проверять его локально.</p>'+editor()+'</div><div class="section notice">Для реальной интеграции сверяйте параметры, примеры и поведение API с актуальной документацией Paynet.</div>'}
function render(page){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===page));const t=page==='overview'?'Обзор платформы':page==='quick'?'Быстрый старт':docs[page]?.title||'Обзор';document.getElementById('crumb').textContent=t;document.getElementById('content').innerHTML=(page==='overview'?overview():page==='quick'?'<div class="eyebrow">Начало работы</div><h1>Быстрый старт</h1><p class="lead">Три шага от регистрации заказа до подтверждения оплаты.</p>'+steps([["Получить доступ","Подготовьте тестовую интеграцию."],["Создать заказ","Направьте покупателя на оплату."],["Подтвердить","Сверьте результат с Paynet через сервер."]])+'<div class="section">'+editor()+'</div>':detail(page))+'<div class="foot">Paynet Developers · GPT design concept · not an official API client</div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>render(b.dataset.page));const test=document.getElementById('test');if(test)test.onclick=()=>{let out;try{out={demo:true,validJson:true,submitted:JSON.parse(document.getElementById('code').value),note:'Запрос не отправлялся в Paynet.'}}catch(e){out={demo:true,validJson:false,error:e.message}}document.getElementById('output').textContent=JSON.stringify(out,null,2);document.getElementById('response').classList.add('show')};const cp=document.getElementById('copy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('code').value);cp.textContent='Скопировано ✓'}catch(e){cp.textContent='Выделите текст'}};document.getElementById('side').classList.remove('open');location.hash=page;window.scrollTo(0,0)}
document.getElementById('nav').innerHTML=sections.map(([g,items])=>'<div class="group">'+g+'</div>'+items.map(([id,icon,title])=>'<button data-nav="'+id+'"><span class="ico">'+icon+'</span>'+title+'</button>').join('')).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>render(b.dataset.nav));document.getElementById('menu').onclick=()=>document.getElementById('side').classList.toggle('open');render(location.hash.slice(1) in docs||['overview','quick'].includes(location.hash.slice(1))?location.hash.slice(1):'overview');
</script></body></html>
