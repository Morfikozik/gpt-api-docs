name: Import published Paynet Developers site
on:
  push:
    paths:
      - .github/workflows/import-original.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: published-site-import
  cancel-in-progress: true
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch published site assets into this repository only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/paynet-live
          BASE="https://paynet-developers-lab-nov26.stoianovo.chatgpt.site"
          for f in app.js content.js core.js data.js index.html llms-full.txt openapi.json paynet_business.svg styles.css; do
            curl --fail --location --retry 3 --max-time 45 "$BASE/$f" -o "/tmp/paynet-live/$f"
            test -s "/tmp/paynet-live/$f"
          done
          grep -q '<div id="app">' /tmp/paynet-live/index.html
          grep -q 'styles.css' /tmp/paynet-live/index.html
          grep -q 'core.js' /tmp/paynet-live/index.html
          python3 -m json.tool /tmp/paynet-live/openapi.json >/dev/null
          for f in app.js content.js core.js data.js index.html llms-full.txt openapi.json paynet_business.svg styles.css; do
            cp "/tmp/paynet-live/$f" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js content.js core.js data.js index.html llms-full.txt openapi.json paynet_business.svg styles.css
          if ! git diff --cached --quiet; then
            git commit -m "Publish existing Paynet Developers Lab site in isolated repository"
            git push
          fi
